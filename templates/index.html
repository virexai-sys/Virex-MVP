    <script>

        /* =====================================================
           EZKROY CONFIG
        ===================================================== */

        const RENDER_URL =
            "https://virex-ai-zi6c.onrender.com";


        const REDIRECT_URL =
            RENDER_URL + "/";


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const statusTitle =
            document.getElementById(
                "statusTitle"
            );


        const statusMessage =
            document.getElementById(
                "statusMessage"
            );


        const progressPercent =
            document.getElementById(
                "progressPercent"
            );


        const successScreen =
            document.getElementById(
                "successScreen"
            );


        const statusIndicator =
            document.getElementById(
                "statusIndicator"
            );


        const steps = [

            document.getElementById(
                "stepCustomer"
            ),

            document.getElementById(
                "stepAI"
            ),

            document.getElementById(
                "stepOrder"
            ),

            document.getElementById(
                "stepDelivery"
            )

        ];


        /* =====================================================
           STATUS
        ===================================================== */

        function setStatus(
            title,
            message
        ) {

            statusTitle.textContent =
                title;

            statusMessage.textContent =
                message;

        }


        /* =====================================================
           PERCENTAGE
        ===================================================== */

        let fakeProgress = 5;


        function setProgress(
            value
        ) {

            fakeProgress =
                Math.min(
                    Math.max(
                        value,
                        0
                    ),
                    100
                );


            progressPercent.textContent =
                Math.round(
                    fakeProgress
                ) + "%";

        }


        /* =====================================================
           EZKROY WORK FLOW ANIMATION
        ===================================================== */

        let currentStep = 0;


        function activateStep(
            index
        ) {

            steps.forEach(
                (
                    step,
                    stepIndex
                ) => {

                    if (
                        stepIndex === index
                    ) {

                        step.classList.add(
                            "active"
                        );

                    }
                    else {

                        step.classList.remove(
                            "active"
                        );

                    }

                }
            );

        }


        function startWorkAnimation() {

            setInterval(
                () => {

                    currentStep++;

                    if (
                        currentStep >=
                        steps.length
                    ) {

                        currentStep = 0;

                    }


                    activateStep(
                        currentStep
                    );

                },
                1600
            );

        }


        /* =====================================================
           FAKE LOADING
        ===================================================== */

        const progressTimer =
            setInterval(
                () => {

                    if (
                        fakeProgress < 88
                    ) {

                        /*
                         * Slower near the end so the
                         * animation does not reach 100%
                         * before Render is ready.
                         */

                        let increment;

                        if (
                            fakeProgress < 45
                        ) {

                            increment =
                                Math.random() * 3.5;

                        }
                        else if (
                            fakeProgress < 70
                        ) {

                            increment =
                                Math.random() * 2.2;

                        }
                        else {

                            increment =
                                Math.random() * 0.8;

                        }


                        setProgress(
                            fakeProgress +
                            increment
                        );

                    }

                },
                650
            );


        /* =====================================================
           SERVER CHECK
        ===================================================== */

        let checking = false;

        let redirecting = false;


        async function checkServer() {

            if (
                checking ||
                redirecting
            ) {

                return;

            }


            checking = true;


            try {

                setStatus(
                    "Connecting to EZKROY AI",
                    "Waking up the EZKROY server..."
                );


                const controller =
                    new AbortController();


                const timeout =
                    setTimeout(
                        () => {

                            controller.abort();

                        },
                        10000
                    );


                const response =
                    await fetch(
                        RENDER_URL +
                        "/api/health?t=" +
                        Date.now(),
                        {

                            method:
                                "GET",

                            cache:
                                "no-store",

                            signal:
                                controller.signal

                        }
                    );


                clearTimeout(
                    timeout
                );


                if (
                    response.ok
                ) {

                    let data = null;


                    try {

                        data =
                            await response.json();

                    }
                    catch (
                        error
                    ) {

                        data =
                            null;

                    }


                    /* =========================================
                       SERVER READY
                    ========================================== */

                    clearInterval(
                        progressTimer
                    );


                    setProgress(
                        100
                    );


                    statusIndicator.style.background =
                        "#24c486";


                    statusIndicator.style.boxShadow =
                        "0 0 0 5px rgba(36,196,134,0.10)";


                    setStatus(
                        "EZKROY AI is ready",
                        "Your sales assistant is ready."
                    );


                    redirecting =
                        true;


                    setTimeout(
                        () => {

                            successScreen.classList.add(
                                "active"
                            );

                        },
                        350
                    );


                    setTimeout(
                        () => {

                            window.location.replace(
                                REDIRECT_URL
                            );

                        },
                        1000
                    );


                    return;

                }


                throw new Error(
                    "Server not ready"
                );

            }
            catch (
                error
            ) {

                /*
                 * Render is probably still waking up.
                 */

                setStatus(
                    "Connecting to EZKROY AI",
                    "Server is starting. Please wait..."
                );


                /*
                 * Never let the fake loader reach 100%
                 * while the server is unavailable.
                 */

                if (
                    fakeProgress > 87
                ) {

                    setProgress(
                        87
                    );

                }

            }
            finally {

                checking =
                    false;

            }

        }


        /* =====================================================
           START ANIMATIONS
        ===================================================== */

        startWorkAnimation();


        /*
         * Check immediately.
         */

        checkServer();


        /*
         * Continue checking every 2.5 seconds.
         */

        setInterval(
            checkServer,
            2500
        );


        /* =====================================================
           PAGE VISIBILITY
        ===================================================== */

        document.addEventListener(
            "visibilitychange",
            () => {

                if (
                    !document.hidden
                ) {

                    checkServer();

                }

            }
        );

    </script>
